name: Sync Vercel backend branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-vercel-backend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into vercel-backend
        id: merge
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main vercel-backend
          git switch --create vercel-backend --track origin/vercel-backend
          git merge --no-edit origin/main

      - name: Push synchronized branch
        if: steps.merge.outcome == 'success'
        run: git push origin HEAD:vercel-backend

      - name: Trigger the Vercel backend deployment
        if: steps.merge.outcome == 'success'
        env:
          VERCEL_BACKEND_DEPLOY_HOOK: ${{ secrets.VERCEL_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_BACKEND_DEPLOY_HOOK" ]; then
            echo "::error::Create a Vercel Deploy Hook for vercel-backend and save its URL as the VERCEL_BACKEND_DEPLOY_HOOK repository secret."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_BACKEND_DEPLOY_HOOK"

      - name: Report a synchronization conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Resolve main → vercel-backend synchronization';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (issues.some((issue) => issue.title === title)) return;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'The automatic merge from `main` into `vercel-backend` failed. No force push was attempted and the Vercel branch was not updated.',
                '',
                `Review the failed workflow run: ${runUrl}`,
                '',
                'Resolve by checking out `vercel-backend`, merging the latest `origin/main`, resolving conflicts while preserving Vercel-only configuration, then pushing the merge commit. Close this issue after the sync succeeds.',
              ].join('\n'),
            });
