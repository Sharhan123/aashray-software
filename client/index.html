<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1681b4" />
    <meta name="description" content="Aashray Hospitality resident and rental management" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('aashray-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <title>Aashray Hospitality | Resident management</title>
    <link rel="icon" type="image/png" href="/aashray-original.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
